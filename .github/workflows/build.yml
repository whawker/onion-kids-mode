name: Build

on:
  push:
    # multi-child-profiles is temporary: it builds the branch without
    # needing a PR open. Remove before merging.
    branches: [main, multi-child-profiles]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile kidui
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain:latest
      options: --user root
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Checkout Onion (pinned)
        uses: actions/checkout@v4
        with:
          repository: OnionUI/Onion
          ref: 07505ea58c7bba698d6b9220ff43946a43cac76b
          path: onion
      - name: Build
        shell: bash
        run: |
          source /root/.bashrc
          cp -r src/kidsMode onion/src/
          cd onion/src/kidsMode
          make
          file kidui
          cp kidui "$GITHUB_WORKSPACE/App/KidsMode/bin/kidui"
      # kidui links Onion's on-screen keyboard (libkbinput) for child-name
      # entry. Kids Mode installs as a standalone app rather than into an
      # Onion build, so it can't ship or assume Onion's lib directory — it
      # relies on libkbinput.so being resolved at runtime from the rpath
      # config.mk bakes in (/mnt/SDCARD/.tmp_update/lib), where Onion's own
      # root Makefile copies lib/. on install. Assert both, so a toolchain
      # that static-links it or a dropped rpath fails here rather than as a
      # launcher that won't start on someone's device.
      - name: Assert the keyboard resolves at runtime
        shell: bash
        run: |
          source /root/.bashrc
          cd onion/src/kidsMode
          dyn=$("${CROSS_COMPILE}readelf" -d kidui)
          echo "$dyn" | grep -E 'NEEDED|PATH'
          echo "$dyn" | grep -q 'NEEDED.*libkbinput\.so' || {
            echo "::error::kidui does not link libkbinput.so dynamically"; exit 1; }
          echo "$dyn" | grep -Eq '(RPATH|RUNPATH).*/mnt/SDCARD/\.tmp_update/lib' || {
            echo "::error::kidui has no rpath to Onion's lib directory"; exit 1; }
      # The App folder is also an install path: people clone the repo and copy
      # it straight onto a card. Releases are always built from source, so the
      # committed binary silently went stale — it sat two versions behind for
      # months. Push the freshly built one back so the two can't diverge.
      - name: Commit the rebuilt binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- App/KidsMode/bin/kidui; then
            echo "bin/kidui already matches the source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/KidsMode/bin/kidui
          # [skip ci] so this commit doesn't trigger another build; the actor
          # guard above is the backstop if that keyword ever stops working
          git commit -m "CI: rebuild bin/kidui from source [skip ci]"
          git push origin HEAD:main
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMode-app
          path: App
          if-no-files-found: error

  release:
    name: Package release zip
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KidsMode-app
          path: App
      - name: Assemble zip
        run: |
          chmod +x App/KidsMode/bin/kidui App/KidsMode/*.sh
          cp README.md App/KidsMode/
          cd App && zip -r ../KidsMode.zip KidsMode
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: Kids Mode ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: KidsMode.zip
